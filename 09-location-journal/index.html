<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Location Journal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main>
    <h1>My Journal</h1>

    <button id="locate-btn">Tag My Location</button>
    <p id="location-status"></p>

    <form id="entry-form">
      <textarea id="entry-text" placeholder="What's on your mind?" required></textarea>
      <button type="submit">Save Entry</button>
    </form>

    <div id="entries"></div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
